[project]
name = "{{SLUG}}"
version = "0.1.0"
description = {{PURPOSE_TOML}}
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
  "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PY_PACKAGE}}"]

[tool.ruff]
line-length = 100
extend-exclude = [".harness", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
